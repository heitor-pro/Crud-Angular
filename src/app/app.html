<div class="app-container">
  
  <!-- CABEÇALHO DO USUÁRIO LOGADO -->
  <header class="app-header">
    <div class="header-brand">
      <div class="brand-icon">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path><polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline><line x1="12" y1="22.08" x2="12" y2="12"></line></svg>
      </div>
      <h2>Painel de Gestão</h2>
    </div>
    
    <div *ngIf="usuarioNome" class="user-profile">
      <span class="user-greeting">Olá, <strong>{{ usuarioNome }}</strong></span>
      <button type="button" (click)="logout()" class="btn btn-danger-outline">
        Sair
      </button>
    </div>
  </header>

  <!-- FORMULÁRIO DE CADASTRO / EDIÇÃO -->
  <section class="card form-card">
    <div class="card-header">
      <h3>{{ idEditando !== null ? 'Editar Produto' : 'Novo Produto' }}</h3>
    </div>
    
    <form (ngSubmit)="salvar()" class="form-grid">
      <div class="form-group">
        <label for="nome">Nome do produto</label>
        <input 
          id="nome" 
          type="text" 
          [(ngModel)]="nome" 
          name="nome" 
          placeholder="Ex: Teclado Mecânico" 
          required 
          class="form-control"
        />
      </div>

      <div class="form-group">
        <label for="preco">Preço (R$)</label>
        <input 
          id="preco" 
          type="number" 
          [(ngModel)]="preco" 
          name="preco" 
          placeholder="0,00" 
          required 
          class="form-control"
        />
      </div>

      <div class="form-actions">
        <button type="submit" class="btn btn-primary">
          {{ idEditando !== null ? 'Atualizar' : 'Salvar' }}
        </button>

        <button 
          *ngIf="idEditando !== null" 
          type="button" 
          (click)="limparFormulario()" 
          class="btn btn-secondary">
          Cancelar
        </button>
      </div>
    </form>
  </section>

  <!-- TABELA DE PRODUTOS -->
  <section class="card table-card">
    <div class="card-header">
      <h3>Listagem de Produtos</h3>
      <span class="badge" *ngIf="produtos.length > 0">{{ produtos.length }} itens</span>
    </div>

    <div class="table-responsive" *ngIf="produtos.length > 0; else semProdutos">
      <table class="custom-table">
        <thead>
          <tr>
            <th class="col-id">#</th>
            <th>Nome</th>
            <th>Preço</th>
            <th class="col-actions">Ações</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let produto of produtos; let i = index">
            <td class="col-id">{{ i + 1 }}</td>
            <td class="font-medium">{{ produto.nome }}</td>
            <td class="price-tag">R$ {{ produto.preco | number:'1.2-2' }}</td>
            <td class="col-actions">
              <button 
                type="button" 
                (click)="editar(produto)" 
                class="btn-icon btn-edit"
                title="Editar">
                Editar
              </button>
              <button 
                type="button" 
                (click)="deletar(produto.id!)" 
                class="btn-icon btn-delete"
                title="Excluir">
                Excluir
              </button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <ng-template #semProdutos>
      <div class="empty-state">
        <p>Nenhum produto cadastrado até o momento.</p>
      </div>
    </ng-template>
  </section>

</div>
